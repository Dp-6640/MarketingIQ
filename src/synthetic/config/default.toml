# --- after the lead --------------------------------------------------------------------

[qualification]
# P(qualified) = lifecycle.<service>.qualify * intent factor * entry-point and origin multipliers.
# Intent factor = intent / intent_reference, clipped to intent_factor_range.
intent_reference = 0.57
intent_factor_range = [0.5, 1.5]
by_entry_point = { meta_lead_form = 0.5, web_chat_agent = 0.9, meta_messaging_agent = 0.9 }
by_origin_channel = { paid_search = 1.2, organic_search = 1.1 }
# Days from lead creation to the qualify/disqualify decision.
decision_days = [0.2, 4.0]

# Rates per new-customer lead: qualify (of leads), book (of qualified), complete (of booked),
# opportunity (of completed consultations, or of qualified without one), win (of closed).
[lifecycle.furnace]
qualify = 0.60
consultation = true
book = 0.55
complete = 0.85
opportunity = 0.90
win = 0.45
close_median_days = 21
amount_median = 5500

