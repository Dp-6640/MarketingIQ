[lifecycle_common]
# Days from lead to close are lognormal around close_median_days with this sigma.
close_sigma = 0.6
# Sale price = amount_median * lognormal(0, amount_sigma).
amount_sigma = 0.35
amount_basis = { purchase_price = 0.55, financed_total = 0.25, lease_contract = 0.15, monthly = 0.05 }
financed_markup = 1.15
lease_months = 120
# Monthly payment = price / monthly_divisor.
monthly_divisor = 90
# Days from booking to the consultation.
booking_lead_days = [1.0, 10.0]
# Expected close date recorded on an open opportunity, in days after it was created.
open_quote_expected_days = 30
no_show_share_of_incomplete = 0.6
service_visit_book = 0.85
service_visit_complete = 0.90

[lifecycle_common.repair_to_replacement]
min_system_age = 15
rate = 0.30
win = 0.45
close_median_days = 14

# --- what the tracking systems record (applied after the truth is written) -------------

[recording]
# Hidden form fields that copy UTMs / click ids from the latest tagged visit into the lead.
utm_capture = 0.85
# GA client id copied into the lead, among households that accepted analytics cookies.
ga_id_capture_given_consent = 0.75
form_page_capture = 0.85
booking_capture = 0.30
chat_capture = 0.40
capture_lookback_days = 30
meta_id_on_lead_form = 0.90
meta_id_on_messaging = 0.70
# Phone leads whose CRM lead source records where the caller heard about the company.
phone_lead_source_self_reported = 0.50
lead_source_wrong = 0.10
request_type_recorded = { web_callback_form = 1.0, phone = 0.85, web_chat_agent = 0.75, meta_messaging_agent = 0.60 }
existing_customer_recorded = { web_callback_form = 1.0, phone = 0.70 }
service_line_recorded = { meta_lead_form = 0.90, phone = 0.80, web_chat_agent = 0.60, meta_messaging_agent = 0.50 }
city_blank = { phone = 0.20, meta_messaging_agent = 0.40, meta_lead_form = 0.10 }
city_variant = 0.15
city_unrecognizable = 0.02
unrecognizable_cities = ["N/A", "Ontario", "asdf", "-", "Canada"]
qualified_date_recorded = 0.70
duplicate_within_72h = 0.06
resubmission_after_72h = 0.01
test_leads = 0.005
duplicate_session_rows = 0.005

[clarity]
bot_session_rate = 0.10
session_count_noise = 0.05
dead_click_rate = 0.05
rage_click_rate = 0.02
location_rage_click_rate = 0.06
quickback_rate = 0.04
excessive_scroll_rate = 0.03
script_error_rate = 0.01
scroll_depth_range = [45.0, 70.0]
