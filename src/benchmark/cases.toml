# MarketingIQ benchmark cases (docs/benchmark.md).
#
# One case per canonical question in docs/question-tool-map.md, plus refusal, clarification
# and abstention cases. Values refer to the default synthetic dataset (seed 20261014,
# data_as_of 2026-09-30: "last month" is September 2026, "last quarter" July-September).
# A question that names no period means the last quarter (the assistant's documented default).
#
# kind:      answer | clarify (ask which one) | abstain (say the data can't give a number)
#            | refuse (out of scope by design)
# calls:     the reference tool calls, in order; the assistant may reach the same results
#            another way, but these are what the answer key is built from
# warnings:  caveat codes the answer must carry; each must appear in the calls' results
# facts:     "<call>:<path>" into a call's result: numbers and values the answer must cite
# expect:    what the results must show for the planted scenario, checked by the reference run
# forbidden: phrases the answer must not use (scored in Phase 4)

[[case]]
id = "Q01"
covers = "question-tool-map #1"
question = "Which campaigns brought in the most qualified new-customer leads last month?"
kind = "answer"
calls = [
  { tool = "get_performance", args = { period = { preset = "last_month" }, group_by = ["campaign"], metrics = ["qualified_leads", "leads"], sort_by = "qualified_leads" } },
]
warnings = ["mapping_unverified", "low_attribution_coverage"]
facts = ["0:resolved.period", "0:resolved.attribution_model", "0:rows[0].key", "0:rows[0].values.qualified_leads.value", "0:totals.qualified_leads.value"]
expect = [
  { path = "0:resolved.period.start", op = "equals", value = "2026-09-01" },
  { path = "0:resolved.period.end", op = "equals", value = "2026-09-30" },
]

[[case]]
id = "Q02"
covers = "question-tool-map #2"
scenario = "S14"
question = "Do leads from the website chat and Facebook Messenger qualify as often as leads from our web forms and phone?"
kind = "answer"
calls = [
  { tool = "get_lead_funnel", args = { period = { preset = "last_quarter" }, group_by = ["entry_point"] } },
]
warnings = ["mapping_unverified", "classification_default_applied"]
facts = ["0:rows{key=web_chat_agent}.values.qualification_rate.value", "0:rows{key=meta_messaging_agent}.values.qualification_rate.value", "0:rows{key=web_quote_form}.values.qualification_rate.value", "0:rows{key=phone}.values.qualification_rate.value"]
expect = [
  { path = "0:rows{key=web_chat_agent}.values.qualification_rate.value", op = "lt", value = "@0:rows{key=web_quote_form}.values.qualification_rate.value" },
]

[[case]]
