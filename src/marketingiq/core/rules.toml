hamilton = "Hamilton"
burlington = "Burlington"
st-catharines = "St. Catharines"
niagara = "Niagara Falls"
ottawa = "Ottawa"
kitchener = "Kitchener"
waterloo = "Waterloo"
london = "London"
windsor = "Windsor"
barrie = "Barrie"
bradford = "Bradford"

