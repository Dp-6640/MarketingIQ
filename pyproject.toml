[project]
name = "marketingiq"
version = "0.1.0"
description = "Internal, read-only marketing intelligence assistant (synthetic-data prototype)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.1",
    "numpy>=2.5.4",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "sqlalchemy>=2.1.4",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketingiq", "src/synthetic", "src/oracle", "src/benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: needs the PostgreSQL test database (TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy's __table_args__ is a class-level dict by design.
"src/marketingiq/models.py" = ["RUF012"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
