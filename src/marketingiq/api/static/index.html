<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MarketingIQ</title>
<style>
/* ---- Tokens ------------------------------------------------------------------------------
   Three materials: the backdrop (moving colour), glass panels (frosted, with a liquid-glass
   rim), and neumorphic controls (soft raised or pressed, same colour as their base). */
:root {
  color-scheme: light;
  --bg: #e4e9f1;
  --blob-1: #8fb8ff; --blob-2: #c4b1ff; --blob-3: #93e2cf; --blob-4: #ffc9a8;
  --glass: rgba(246, 248, 252, 0.62);
  --glass-strong: rgba(250, 251, 254, 0.86);
  --rim-hi: rgba(255, 255, 255, 0.95); --rim-lo: rgba(255, 255, 255, 0.18);
  --sheen: rgba(255, 255, 255, 0.55);
  --neu: #e9edf4;
  --neu-hi: rgba(255, 255, 255, 0.95); --neu-lo: rgba(150, 165, 190, 0.55);
  --ink: #121722; --ink-2: #444c5c; --ink-3: #5c6577;
  --line: rgba(18, 23, 34, 0.10);
  --accent: #2a78d6; --accent-ink: #1c5cab; --on-accent: #ffffff;
  --muted-mark: #9aa4b5;
  --good: #0ca30c; --good-ink: #006300;
  --warn: #fab219; --bad: #d03b3b; --bad-ink: #a82a2a;
  --t1: #2a78d6; --t2: #eb6834; --t3: #1baf7a; --t4: #eda100;
  --radius: 22px; --radius-s: 14px;
  --shadow-panel: 0 20px 50px rgba(40, 55, 85, 0.16), 0 2px 6px rgba(40, 55, 85, 0.08);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --bg: #0f1218;
    --blob-1: #1f4fa8; --blob-2: #4b2f9e; --blob-3: #0f6b5a; --blob-4: #8a3d1f;
    --glass: rgba(24, 29, 39, 0.58); --glass-strong: rgba(26, 31, 41, 0.9);
    --rim-hi: rgba(255, 255, 255, 0.28); --rim-lo: rgba(255, 255, 255, 0.04);
    --sheen: rgba(255, 255, 255, 0.07);
    --neu: #1c212b; --neu-hi: rgba(255, 255, 255, 0.06); --neu-lo: rgba(0, 0, 0, 0.6);
    --ink: #eef1f6; --ink-2: #b9c0cc; --ink-3: #8f98a8;
    --line: rgba(255, 255, 255, 0.09);
    --accent: #3987e5; --accent-ink: #86b6ef; --on-accent: #0b1525;
    --muted-mark: #5d6678;
    --good-ink: #2fc42f; --bad-ink: #ff8a8a;
    --t1: #3987e5; --t2: #d95926; --t3: #199e70; --t4: #c98500;
    --shadow-panel: 0 24px 60px rgba(0, 0, 0, 0.5), 0 2px 6px rgba(0, 0, 0, 0.4);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1218;
  --blob-1: #1f4fa8; --blob-2: #4b2f9e; --blob-3: #0f6b5a; --blob-4: #8a3d1f;
  --glass: rgba(24, 29, 39, 0.58); --glass-strong: rgba(26, 31, 41, 0.9);
  --rim-hi: rgba(255, 255, 255, 0.28); --rim-lo: rgba(255, 255, 255, 0.04);
  --sheen: rgba(255, 255, 255, 0.07);
  --neu: #1c212b; --neu-hi: rgba(255, 255, 255, 0.06); --neu-lo: rgba(0, 0, 0, 0.6);
  --ink: #eef1f6; --ink-2: #b9c0cc; --ink-3: #8f98a8;
  --line: rgba(255, 255, 255, 0.09);
  --accent: #3987e5; --accent-ink: #86b6ef; --on-accent: #0b1525;
  --muted-mark: #5d6678;
  --good-ink: #2fc42f; --bad-ink: #ff8a8a;
  --t1: #3987e5; --t2: #d95926; --t3: #199e70; --t4: #c98500;
  --shadow-panel: 0 24px 60px rgba(0, 0, 0, 0.5), 0 2px 6px rgba(0, 0, 0, 0.4);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 14.5px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  overflow: hidden;
}
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---- Backdrop: slow, blurred colour fields the glass refracts --------------------------- */
.backdrop { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
.blob { position: absolute; width: 46vmax; height: 46vmax; border-radius: 50%;
        filter: blur(70px); opacity: 0.55; animation: drift 38s ease-in-out infinite alternate; }
.blob.b1 { background: var(--blob-1); top: -18vmax; left: -10vmax; }
.blob.b2 { background: var(--blob-2); top: 10vmax; right: -16vmax; animation-duration: 46s; }
.blob.b3 { background: var(--blob-3); bottom: -22vmax; left: 18vmax; animation-duration: 52s; }
.blob.b4 { background: var(--blob-4); bottom: -10vmax; right: 12vmax; width: 30vmax; height: 30vmax;
           animation-duration: 41s; opacity: 0.4; }
@keyframes drift { to { transform: translate(6vmax, 4vmax) scale(1.12); } }

/* ---- Glass panels with a liquid-glass rim and specular sheen ---------------------------- */
.glass {
  position: relative; background: var(--glass); border-radius: var(--radius);
  backdrop-filter: blur(26px) saturate(170%); -webkit-backdrop-filter: blur(26px) saturate(170%);
  box-shadow: var(--shadow-panel), inset 0 1px 0 var(--rim-hi), inset 0 -1px 0 var(--rim-lo);
}
.glass::before {  /* the rim: bright where light would catch the curved edge */
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px;
  background: linear-gradient(140deg, var(--rim-hi), var(--rim-lo) 38%, var(--rim-lo) 62%, var(--rim-hi));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
}
.glass::after {   /* the sheen: a soft specular highlight across the top */
  content: ""; position: absolute; inset: 0 0 auto 0; height: 46%; border-radius: inherit;
  background: linear-gradient(180deg, var(--sheen), transparent);
  pointer-events: none; opacity: 0.7;
}
.glass > * { position: relative; z-index: 1; }

/* ---- Neumorphic surfaces and controls --------------------------------------------------- */
.neu { background: var(--neu); border-radius: var(--radius-s);
       box-shadow: 7px 7px 16px var(--neu-lo), -7px -7px 16px var(--neu-hi); }
.neu-inset { background: var(--neu); border-radius: var(--radius-s);
             box-shadow: inset 4px 4px 10px var(--neu-lo), inset -4px -4px 10px var(--neu-hi); }
.btn {
  border: 0; cursor: pointer; padding: 8px 14px; border-radius: 12px; background: var(--neu);
  box-shadow: 4px 4px 10px var(--neu-lo), -4px -4px 10px var(--neu-hi);
  transition: box-shadow .15s, transform .15s; display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { transform: translateY(-1px); }
.btn:active, .btn[aria-pressed="true"] {
  transform: none; box-shadow: inset 3px 3px 8px var(--neu-lo), inset -3px -3px 8px var(--neu-hi);
}
.btn.primary { background: linear-gradient(145deg, var(--accent), var(--accent-ink)); color: var(--on-accent);
               font-weight: 600; box-shadow: 4px 4px 12px var(--neu-lo), -3px -3px 10px var(--neu-hi),
               inset 0 1px 0 rgba(255,255,255,.35); }
.btn.primary:disabled { opacity: .55; cursor: progress; transform: none; }
.btn.icon { padding: 8px; width: 38px; height: 38px; justify-content: center; }
.btn svg { width: 18px; height: 18px; }

/* ---- Page layout: full screen ------------------------------------------------------------ */
.app {
  position: relative; z-index: 1; height: 100dvh; display: grid; gap: 14px; padding: 14px;
  grid-template-rows: auto auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr);
}
.topbar { display: flex; align-items: center; gap: 12px; padding: 10px 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; margin-right: 6px; }
.logo { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center;
        background: linear-gradient(145deg, var(--accent), var(--t3)); color: #fff;
        box-shadow: 4px 4px 10px var(--neu-lo), -3px -3px 9px var(--neu-hi), inset 0 1px 0 rgba(255,255,255,.4); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px;
        font-size: 12.5px; color: var(--ink-2); background: var(--neu);
        box-shadow: inset 2px 2px 5px var(--neu-lo), inset -2px -2px 5px var(--neu-hi); white-space: nowrap; }
.pill.synthetic { color: var(--ink); font-weight: 600; }
.pill.synthetic::before { content: "\26A0"; color: var(--warn); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted-mark); }
.dot.ok { background: var(--good); } .dot.bad { background: var(--bad); }
.topbar .spacer { flex: 1; }
.drawer-btn { display: none; }

/* ---- KPI row ------------------------------------------------------------------------------ */
.kpis { padding: 12px 14px 14px; }
.kpis-head { display: flex; align-items: baseline; gap: 10px; margin: 0 2px 10px; flex-wrap: wrap; }
.kpis-head h2 { font-size: 13px; font-weight: 600; margin: 0; color: var(--ink-2); letter-spacing: .02em; }
.kpis-head .note { font-size: 12px; color: var(--ink-3); }
.kpis-head .spacer { flex: 1; }
.tiles { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px; }
.tile { padding: 12px 14px 10px; min-width: 0; outline: none; }
.tile .label { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .value { font-size: 24px; font-weight: 650; margin-top: 2px; line-height: 1.15; }
.tile .delta { font-size: 12px; color: var(--ink-3); margin-top: 1px; white-space: nowrap; }
.tile .delta.up-good, .tile .delta.down-good { color: var(--good-ink); }
.tile .delta.up-bad, .tile .delta.down-bad { color: var(--bad-ink); }
.tile svg.spark { display: block; width: 100%; height: 34px; margin-top: 6px; overflow: visible; }
.tile .hidden-note { font-size: 12px; color: var(--ink-3); margin-top: 8px; }
.kpi-table-wrap { margin-top: 12px; overflow-x: auto; border-radius: var(--radius-s); }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
th { color: var(--ink-2); font-weight: 600; }
.warnings-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.chip { font-size: 12px; padding: 3px 10px; border-radius: 999px; color: var(--ink-2); background: var(--neu);
        box-shadow: 2px 2px 5px var(--neu-lo), -2px -2px 5px var(--neu-hi); }

/* ---- Workspace: history | conversation | inspector --------------------------------------- */
.workspace { display: grid; gap: 14px; min-height: 0;
             grid-template-columns: 290px minmax(0, 1fr) 380px; }
.panel { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.panel-head { display: flex; align-items: center; gap: 8px; padding: 14px 16px 10px; }
.panel-head h2 { font-size: 14px; margin: 0; font-weight: 650; }
.panel-head .spacer { flex: 1; }
.scroll { overflow-y: auto; min-height: 0; flex: 1; padding: 0 16px 16px; }
.scroll::-webkit-scrollbar { width: 8px; }
.scroll::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }

/* history */
.search { margin: 0 16px 10px; display: flex; align-items: center; gap: 8px; padding: 8px 12px; }
.search input { border: 0; background: transparent; outline: none; width: 100%; }
.history-group { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); margin: 12px 4px 6px; }
.history-item { display: block; width: 100%; text-align: left; border: 0; background: transparent; cursor: pointer;
                padding: 9px 10px; border-radius: 12px; margin-bottom: 4px; transition: background .15s, box-shadow .15s; }
.history-item:hover { background: var(--neu); box-shadow: 3px 3px 8px var(--neu-lo), -3px -3px 8px var(--neu-hi); }
.history-item[aria-current="true"] { background: var(--neu);
  box-shadow: inset 3px 3px 7px var(--neu-lo), inset -3px -3px 7px var(--neu-hi); }
.history-item .q { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 13.5px; }
.history-item .meta { display: flex; gap: 8px; align-items: center; margin-top: 3px; font-size: 11.5px; color: var(--ink-3); }

/* status: icon + label in ink; the colour sits on the icon only */
.status { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600;
          text-transform: uppercase; letter-spacing: .04em; color: var(--ink-2); }
.status i { width: 14px; height: 14px; border-radius: 50%; display: inline-grid; place-items: center;
            font-style: normal; font-size: 9.5px; color: #fff; }
.status.answered i { background: var(--good); } .status.answered i::before { content: "\2713"; }
.status.clarify i { background: var(--accent); } .status.clarify i::before { content: "?"; }
.status.abstain i { background: var(--warn); color: #0b0b0b; } .status.abstain i::before { content: "!"; }
.status.refuse i, .status.failed i { background: var(--bad); } .status.refuse i::before, .status.failed i::before { content: "\2715"; }
.status.pending i { background: var(--muted-mark); } .status.pending i::before { content: "\2026"; }

/* conversation */
.thread-wrap { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.thread { overflow-y: auto; flex: 1; min-height: 0; padding: 4px 22px 18px; scroll-behavior: smooth; }
.msg { max-width: 920px; margin: 0 auto 16px; }
.msg.user { display: flex; justify-content: flex-end; }
.bubble-user { padding: 10px 16px; max-width: 78%; border-radius: 18px 18px 6px 18px;
               box-shadow: 5px 5px 12px var(--neu-lo), -5px -5px 12px var(--neu-hi); background: var(--neu); white-space: pre-wrap; }
.answer-card { padding: 16px 18px 12px; border-radius: 18px; background: var(--glass-strong);
               box-shadow: 0 8px 26px rgba(40,55,85,.12), inset 0 1px 0 var(--rim-hi); }
.answer-card.selected { box-shadow: 0 0 0 2px var(--accent), 0 8px 26px rgba(40,55,85,.12); }
.answer-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.answer-head .spacer { flex: 1; }
.answer-head .when { font-size: 12px; color: var(--ink-3); }
.answer-text { font-size: 15.5px; line-height: 1.6; white-space: pre-wrap; }
.answer-text mark { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--ink);
  padding: 0 4px; border-radius: 6px; font-weight: 650; cursor: pointer; border-bottom: 2px solid var(--accent); }
.answer-text mark:hover, .answer-text mark.active { background: color-mix(in srgb, var(--accent) 30%, transparent); }
.answer-error { color: var(--bad-ink); font-size: 13.5px; margin-top: 6px; }
.caveats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.caveat { font-size: 12px; padding: 4px 10px; border-radius: 10px; color: var(--ink-2); background: var(--neu);
          box-shadow: inset 2px 2px 5px var(--neu-lo), inset -2px -2px 5px var(--neu-hi); }
.answer-foot { display: flex; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.answer-foot .btn { padding: 5px 11px; font-size: 12.5px; border-radius: 10px; }
.answer-foot .meta { font-size: 12px; color: var(--ink-3); margin-left: auto; }
.working { display: flex; align-items: center; gap: 10px; color: var(--ink-2); }
.orb { width: 18px; height: 18px; border-radius: 50%; background: conic-gradient(var(--accent), var(--t3), var(--t2), var(--accent));
       animation: spin 1.4s linear infinite; mask: radial-gradient(circle, transparent 5px, #000 6px); -webkit-mask: radial-gradient(circle, transparent 5px, #000 6px); }
@keyframes spin { to { transform: rotate(1turn); } }

/* empty state */
.empty { max-width: 860px; margin: 4vh auto 0; text-align: center; }
.empty h1 { font-size: clamp(22px, 2.4vw, 31px); margin: 0 0 6px; letter-spacing: -.01em; text-wrap: balance; }
.empty p { color: var(--ink-2); margin: 0 auto 22px; max-width: 620px; }
.examples { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; text-align: left; }
.example { border: 0; cursor: pointer; padding: 14px 16px; text-align: left; transition: transform .15s; }
.example:hover { transform: translateY(-2px); }
.example b { display: block; font-size: 12px; color: var(--accent-ink); margin-bottom: 4px; font-weight: 650; }

/* composer */
.composer { padding: 12px 18px 16px; }
.composer-inner { max-width: 920px; margin: 0 auto; }
.composer-row { display: flex; gap: 10px; align-items: flex-end; }
.composer textarea { flex: 1; resize: none; border: 0; outline: none; padding: 12px 14px; min-height: 48px; max-height: 180px;
                     line-height: 1.45; }
.composer .hint { font-size: 12px; color: var(--ink-3); margin-top: 8px; display: flex; gap: 12px; flex-wrap: wrap; }
.composer .hint .ctx { color: var(--ink-2); }

/* inspector */
.tabs { display: flex; gap: 6px; padding: 0 16px 10px; }
.tab { border: 0; background: transparent; cursor: pointer; padding: 7px 12px; border-radius: 11px; color: var(--ink-2); font-size: 13px; }
.tab[aria-selected="true"] { color: var(--ink); font-weight: 600; background: var(--neu);
  box-shadow: inset 3px 3px 7px var(--neu-lo), inset -3px -3px 7px var(--neu-hi); }
.inspector-empty { color: var(--ink-3); font-size: 13.5px; padding: 8px 2px; }
.cite { padding: 10px 12px; margin-bottom: 10px; border-radius: 14px; background: var(--neu);
        box-shadow: 3px 3px 8px var(--neu-lo), -3px -3px 8px var(--neu-hi); transition: box-shadow .2s; }
.cite.active { box-shadow: 0 0 0 2px var(--accent), 3px 3px 8px var(--neu-lo); }
.cite .v { font-size: 18px; font-weight: 650; }
.cite .src { font-size: 12px; color: var(--ink-2); }
.cite code, .call code, pre { font-size: 11.5px; word-break: break-all; color: var(--ink-2); }
.call { padding: 10px 12px; margin-bottom: 10px; border-radius: 14px; background: var(--neu);
        box-shadow: 3px 3px 8px var(--neu-lo), -3px -3px 8px var(--neu-hi); }
.call .row1 { display: flex; gap: 8px; align-items: center; font-size: 13px; }
.call .row1 .spacer { flex: 1; }
.call .ms { font-size: 12px; color: var(--ink-3); }
.call details summary { cursor: pointer; font-size: 12px; color: var(--ink-3); margin-top: 4px; }
pre { white-space: pre-wrap; margin: 6px 0 0; padding: 8px; border-radius: 10px; background: color-mix(in srgb, var(--neu) 70%, transparent); }
.segbar { display: flex; gap: 2px; height: 8px; margin: 6px 0 12px; }
.segbar span { border-radius: 4px; min-width: 0; }
.legend-table td:first-child { width: 18px; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: middle; }
.timing-total { font-size: 26px; font-weight: 650; }
.timing-note { font-size: 12.5px; color: var(--ink-3); margin-top: 10px; }

/* tooltip */
.tooltip { position: fixed; z-index: 50; pointer-events: none; padding: 6px 10px; border-radius: 10px; font-size: 12.5px;
           background: var(--glass-strong); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
           box-shadow: 0 6px 20px rgba(0,0,0,.18), inset 0 1px 0 var(--rim-hi); opacity: 0; transition: opacity .1s; }
.tooltip strong { display: block; font-size: 14px; }
.tooltip span { color: var(--ink-2); }

/* ---- Narrower screens: side panels become drawers ---------------------------------------- */
@media (max-width: 1360px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 1280px) {
  .workspace { grid-template-columns: minmax(0, 1fr) 360px; }
  .history { position: fixed; z-index: 30; top: 14px; bottom: 14px; left: 14px; width: 300px;
             transform: translateX(-120%); transition: transform .25s; }
  .history.open { transform: none; }
  .drawer-btn.history-btn { display: inline-flex; }
}
@media (max-width: 960px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100dvh; grid-template-rows: auto auto auto; }
  .workspace { grid-template-columns: minmax(0, 1fr); }
  .conversation { height: 78vh; }
  .inspector { position: fixed; z-index: 30; top: 14px; bottom: 14px; right: 14px; width: min(380px, calc(100vw - 28px));
               transform: translateX(120%); transition: transform .25s; }
  .inspector.open { transform: none; }
  .drawer-btn.inspector-btn { display: inline-flex; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 520px) {
  body { overflow-x: hidden; }
  .app { padding: 10px; gap: 10px; }
  .bubble-user { max-width: 92%; }
  .pill { white-space: normal; }
  .brand { margin-right: auto; }
  .tiles { gap: 10px; }
  .tile .value { font-size: 21px; }
  .tile .delta { white-space: normal; }
  #new-chat { font-size: 13px; }
}

/* ---- Comfort settings --------------------------------------------------------------------- */
@media (prefers-reduced-motion: reduce) {
  .blob, .orb { animation: none; }
  * { transition: none !important; scroll-behavior: auto !important; }
}
@media (prefers-reduced-transparency: reduce) {
  .glass { background: var(--glass-strong); backdrop-filter: none; -webkit-backdrop-filter: none; }
  .blob { display: none; }
}
@media (forced-colors: active) {
  .glass, .neu, .btn, .cite, .call, .answer-card { border: 1px solid CanvasText; }
}
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
</div>

<div class="tooltip" id="tooltip" role="status"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
// Every piece of text from the data or the model goes in as text, never as HTML.
const el = (tag, text, attrs = {}) => {
  const node = document.createElement(tag);
  if (text !== undefined && text !== null) node.textContent = text;
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  return node;
};
const store = {
  get(key) { try { return localStorage.getItem(key); } catch { return null; } },
  set(key, value) { try { localStorage.setItem(key, value); } catch { /* private mode */ } },
};

const EXAMPLES = [
  ["Top campaigns", "Which campaigns brought in the most qualified new-customer leads last month?"],
  ["Attribution", "How much credit does retargeting get under each attribution model over the past year?"],
  ["Sources", "How do Meta's reported leads compare with the leads in Salesforce, campaign by campaign, last month?"],
  ["Is it real?", "Did the location-page redesign change how often visitors submit a form?"],
  ["Data quality", "What can't we conclude about July 2026?"],
  ["Ambiguous name", "How is the furnace campaign doing?"],
];

let thread = [];           // runs in the current conversation, oldest first
let selectedRun = null;    // the run shown in the inspector
let activeTab = "evidence";
let activeCitation = null;
let historyRuns = [];
let dashboard = null;

// ---- Formatting --------------------------------------------------------------------------
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const monthName = (ym, long) => {
  const [y, m] = ym.split("-").map(Number);
  return long ? new Date(y, m - 1, 1).toLocaleString(undefined, { month: "long", year: "numeric" })
              : `${MONTHS[m - 1]} ${String(y).slice(2)}`;
};
function fmt(value, unit, currency) {
  if (value === null || value === undefined) return "–";
  if (unit === "rate") return `${(value * 100).toFixed(1)}%`;
  if (unit === "currency") {
    const digits = Math.abs(value) >= 1000 ? 0 : 2;
    return new Intl.NumberFormat(undefined, { style: "currency", currency: currency || "CAD",
      currencyDisplay: "narrowSymbol", maximumFractionDigits: digits, minimumFractionDigits: digits }).format(value);
  }
  if (Math.abs(value) >= 10000) return new Intl.NumberFormat(undefined, { notation: "compact", maximumFractionDigits: 1 }).format(value);
  return new Intl.NumberFormat(undefined, { maximumFractionDigits: Number.isInteger(value) ? 0 : 1 }).format(value);
}
const seconds = (ms) => `${(ms / 1000).toFixed(1)} s`;
const ago = (iso) => {
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return `${Math.round(s / 60)} min ago`;
  if (s < 86400) return `${Math.round(s / 3600)} h ago`;
  return new Date(iso).toLocaleDateString(undefined, { day: "numeric", month: "short" });
};

// ---- Tooltip -----------------------------------------------------------------------------
const tooltip = $("tooltip");
function showTip(x, y, strong, sub) {
  tooltip.replaceChildren(el("strong", strong), el("span", sub));
  const w = 180;
  tooltip.style.left = `${Math.min(window.innerWidth - w - 8, x + 14)}px`;
  tooltip.style.top = `${Math.max(8, y - 52)}px`;
  tooltip.style.opacity = "1";
}
const hideTip = () => { tooltip.style.opacity = "0"; };

// ---- Header and KPI tiles ------------------------------------------------------------------
async function loadHealth() {
  try {
    const r = await fetch("/health");
    const body = await r.json();
    $("health-dot").className = "dot " + (body.database === "ok" ? "ok" : "bad");
  } catch { $("health-dot").className = "dot bad"; }
}

async function loadDashboard() {
  try {
    const r = await fetch("/api/v1/dashboard");
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    dashboard = await r.json();
  } catch (error) {
    $("tiles").replaceChildren(el("div", `The headline figures couldn't load: ${error.message}`, { class: "hidden-note" }));
    return;
  }
  const d = dashboard;
  $("asof").textContent = `Data to ${new Date(d.data_as_of + "T12:00").toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" })}`;
  $("model-name").textContent = d.model;
  const last = d.months.at(-1), prev = d.months.at(-2);
  $("kpis-title").textContent = `${monthName(last, true)} vs ${monthName(prev, true)}`;
  $("kpis-note").textContent = `New-customer leads by creation month · computed by the analytics tools, no AI involved`;
  renderTiles();
  renderKpiTable();
  const warnings = $("kpi-warnings");
  warnings.replaceChildren(...d.warnings.map((w) => el("span", w.message, { class: "chip" })));
}

function renderTiles() {
  const tiles = $("tiles");
  tiles.replaceChildren();
  for (const tile of dashboard.tiles) {
    const series = tile.series;
    const cur = series.at(-1), prev = series.at(-2);
    const card = el("div", null, { class: "tile neu", tabindex: "0" });
    card.append(el("div", tile.label, { class: "label", title: tile.definition }));
    const value = cur.value === null ? (cur.suppressed ? "Hidden" : "–") : fmt(cur.value, tile.unit, dashboard.currency);
    card.append(el("div", value, { class: "value" }));
    card.append(deltaLine(tile, cur, prev));
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("class", "spark");
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", `${tile.label}, last 12 months: ` +
      series.map((p) => `${monthName(p.month)} ${fmt(p.value, tile.unit, dashboard.currency)}`).join(", "));
    card.append(svg);
    tiles.append(card);
    requestAnimationFrame(() => drawSpark(svg, tile));
    card.addEventListener("focus", () => {
      const r = card.getBoundingClientRect();
      showTip(r.left, r.top + 30, fmt(cur.value, tile.unit, dashboard.currency), `${tile.label} · ${monthName(cur.month, true)}`);
    });
    card.addEventListener("blur", hideTip);
  }
}

function deltaLine(tile, cur, prev) {
  const line = el("div", null, { class: "delta" });
  if (cur.value === null || prev.value === null || prev.value === 0) {
    line.textContent = `vs ${monthName(prev.month)}: not comparable`;
    return line;
  }
  const change = (cur.value - prev.value) / Math.abs(prev.value);
  const up = change > 0.0005, down = change < -0.0005;
  const arrow = up ? "▲" : down ? "▼" : "●";
  const sign = up ? "+" : "";
  line.textContent = `${arrow} ${sign}${(change * 100).toFixed(1)}% vs ${monthName(prev.month)}`;
  if (tile.rise_is_good !== null && (up || down)) {
    const good = (up && tile.rise_is_good) || (down && !tile.rise_is_good);
    line.className = `delta ${up ? "up" : "down"}-${good ? "good" : "bad"}`;
  }
  return line;
}

// A 12-point sparkline: muted history, the current month in the accent, a crosshair on hover.
function drawSpark(svg, tile) {
  const ns = "http://www.w3.org/2000/svg";
  const w = svg.clientWidth || 160, h = 34, pad = 5;
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  svg.replaceChildren();
  const pts = tile.series.map((p, i) => ({ ...p, i }));
  const vals = pts.filter((p) => p.value !== null).map((p) => p.value);
  if (vals.length < 2) return;
  const lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
  const x = (i) => pad + (i * (w - 2 * pad)) / (pts.length - 1);
  const y = (v) => h - pad - ((v - lo) / span) * (h - 2 * pad);
  // Missing months (hidden or null) break the line rather than bridging it.
  let d = "", pen = false;
  for (const p of pts) {
    if (p.value === null) { pen = false; continue; }
    d += `${pen ? "L" : "M"}${x(p.i).toFixed(1)},${y(p.value).toFixed(1)}`;
    pen = true;
  }
  const path = document.createElementNS(ns, "path");
  path.setAttribute("d", d);
  path.setAttribute("fill", "none");
  path.setAttribute("stroke", "var(--muted-mark)");
  path.setAttribute("stroke-width", "2");
  path.setAttribute("stroke-linejoin", "round");
  path.setAttribute("stroke-linecap", "round");
  svg.append(path);
  const last = pts.at(-1);
  if (last.value !== null) {
    const ring = document.createElementNS(ns, "circle");
    ring.setAttribute("cx", x(last.i)); ring.setAttribute("cy", y(last.value)); ring.setAttribute("r", "5.5");
    ring.setAttribute("fill", "var(--neu)");
    const dot = document.createElementNS(ns, "circle");
    dot.setAttribute("cx", x(last.i)); dot.setAttribute("cy", y(last.value)); dot.setAttribute("r", "4");
    dot.setAttribute("fill", "var(--accent)");
    svg.append(ring, dot);
  }
  const cross = document.createElementNS(ns, "line");
  cross.setAttribute("y1", "0"); cross.setAttribute("y2", String(h));
  cross.setAttribute("stroke", "var(--ink-3)"); cross.setAttribute("stroke-width", "1"); cross.setAttribute("opacity", "0");
  svg.append(cross);
  svg.onpointermove = (event) => {
    const box = svg.getBoundingClientRect();
    const i = Math.max(0, Math.min(pts.length - 1, Math.round(((event.clientX - box.left - pad) / (w - 2 * pad)) * (pts.length - 1))));
    const p = pts[i];
    cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("opacity", "0.6");
    const shown = p.value === null ? (p.suppressed ? "Hidden (fewer than 5)" : "Not available") : fmt(p.value, tile.unit, dashboard.currency);
    showTip(event.clientX, event.clientY, shown, `${tile.label} · ${monthName(p.month, true)}`);
  };
  svg.onpointerleave = () => { cross.setAttribute("opacity", "0"); hideTip(); };
}

function renderKpiTable() {
  const table = el("table");
  const head = el("tr");
  head.append(el("th", "Month"));
  for (const t of dashboard.tiles) head.append(el("th", t.label, { class: "num" }));
  const thead = el("thead"); thead.append(head);
  const tbody = el("tbody");
  dashboard.months.forEach((month, i) => {
    const tr = el("tr");
    tr.append(el("td", monthName(month, true)));
    for (const t of dashboard.tiles) {
      const p = t.series[i];
      tr.append(el("td", p.value === null ? (p.suppressed ? "hidden" : "–") : fmt(p.value, t.unit, dashboard.currency), { class: "num" }));
    }
    tbody.append(tr);
  });
  table.append(thead, tbody);
  $("kpi-table-wrap").replaceChildren(table);
}

$("kpi-table-toggle").addEventListener("click", (e) => {
  const open = e.currentTarget.getAttribute("aria-pressed") !== "true";
  e.currentTarget.setAttribute("aria-pressed", String(open));
  e.currentTarget.textContent = open ? "Hide table" : "Show as table";
  $("kpi-table-wrap").hidden = !open;
});
let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (dashboard) renderTiles(); }, 150);
});

// ---- History -------------------------------------------------------------------------------
async function loadHistory() {
  try {
    const r = await fetch("/api/v1/assistant/runs?limit=60");
    historyRuns = (await r.json()).runs;
  } catch { historyRuns = []; }
  renderHistory();
}

function renderHistory() {
  const list = $("history-list");
  const term = $("history-search").value.trim().toLowerCase();
  const runs = historyRuns.filter((r) => !term || r.question.toLowerCase().includes(term));
  list.replaceChildren();
  if (!runs.length) { list.append(el("div", term ? "No questions match." : "No questions yet.", { class: "inspector-empty" })); return; }
  const today = new Date().toDateString();
  let group = null;
  for (const run of runs) {
    const label = new Date(run.created_at).toDateString() === today ? "Today" : "Earlier";
    if (label !== group) { list.append(el("div", label, { class: "history-group" })); group = label; }
    const item = el("button", null, { class: "history-item", type: "button" });
    if (thread.some((t) => t.run_id === run.id)) item.setAttribute("aria-current", "true");
    item.append(el("span", run.question, { class: "q" }));
    const meta = el("span", null, { class: "meta" });
    meta.append(statusBadge(run.status), el("span", `${ago(run.created_at)} · ${seconds(run.latency_ms)}`));
    item.append(meta);
    item.addEventListener("click", () => openConversation(run.id));
    list.append(item);
  }
}
$("history-search").addEventListener("input", renderHistory);
$("refresh-history").addEventListener("click", loadHistory);

function statusBadge(status) {
  const badge = el("span", null, { class: `status ${status}` });
  badge.append(el("i", null, { "aria-hidden": "true" }), document.createTextNode(status));
  return badge;
}

// Reopen a logged answer with the whole conversation that led to it.
async function openConversation(runId) {
  const chain = [];
  let id = runId;
  while (id && chain.length < 8) {
    const r = await fetch(`/api/v1/assistant/runs/${encodeURIComponent(id)}`);
    if (!r.ok) break;
    const run = await r.json();
    chain.unshift(run);
    id = run.follows;
  }
  thread = chain;
  renderThread();
  select(thread.at(-1));
  closeDrawers();
  renderHistory();
}

// ---- Conversation --------------------------------------------------------------------------
function renderThread(pending) {
  const box = $("thread");
  box.replaceChildren();
  if (!thread.length && !pending) { box.append(emptyState()); updateContext(); return; }
  for (const run of thread) {
    box.append(userMessage(run.question));
    box.append(answerMessage(run));
  }
  if (pending) {
    box.append(userMessage(pending.question));
    box.append(workingMessage(pending));
  }
  updateContext();
  box.scrollTop = box.scrollHeight;
}

function emptyState() {
  const wrap = el("div", null, { class: "empty" });
  wrap.append(el("h1", "Ask about your marketing, get numbers you can check"));
  wrap.append(el("p", "Every number in an answer is filled in from an analytics tool, never written by the AI. Click a highlighted number to see where it came from."));
  const grid = el("div", null, { class: "examples" });
  for (const [tag, question] of EXAMPLES) {
    const card = el("button", null, { class: "example neu", type: "button" });
    card.append(el("b", tag), document.createTextNode(question));
    card.addEventListener("click", () => { $("question").value = question; ask(); });
    grid.append(card);
  }
  wrap.append(grid);
  return wrap;
}

function userMessage(text) {
  const row = el("div", null, { class: "msg user" });
  row.append(el("div", text, { class: "bubble-user" }));
  return row;
}

function workingMessage(pending) {
  const row = el("div", null, { class: "msg" });
  const card = el("div", null, { class: "answer-card" });
  const line = el("div", null, { class: "working" });
  const label = el("span", "Choosing tools and reading results… usually 10–30 s on the free model");
  line.append(el("span", null, { class: "orb", "aria-hidden": "true" }), label);
  card.append(line);
  row.append(card);
  pending.timer = setInterval(() => {
    label.textContent = `Choosing tools and reading results… ${Math.round((Date.now() - pending.started) / 1000)} s`;
  }, 1000);
  return row;
}

function answerMessage(run) {
  const row = el("div", null, { class: "msg" });
  const card = el("div", null, { class: "answer-card" + (selectedRun === run ? " selected" : "") });
  card.dataset.run = run.run_id || "";
  const head = el("div", null, { class: "answer-head" });
  head.append(statusBadge(run.status), el("span", null, { class: "spacer" }));
  if (run.created_at) head.append(el("span", ago(run.created_at), { class: "when" }));
  card.append(head);

  const text = el("div", null, { class: "answer-text" });
  for (const piece of run.segments || []) {
    if (piece.value !== undefined) {
      const c = run.citations[piece.citation];
      const mark = el("mark", piece.value, { tabindex: "0", title: `${c.call}: ${c.path}`, role: "button" });
      const open = () => { select(run); showCitation(piece.citation); };
      mark.addEventListener("click", open);
      mark.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
      text.append(mark);
    } else {
      text.append(document.createTextNode(piece.text));
    }
  }
  if (!(run.segments || []).length && run.answer) text.textContent = run.answer;
  if (!run.answer && run.status === "failed") text.textContent = "No answer: the run failed.";
  card.append(text);
  for (const error of run.errors || []) card.append(el("div", error, { class: "answer-error" }));

  if ((run.caveats || []).length) {
    const caveats = el("div", null, { class: "caveats" });
    for (const c of run.caveats) caveats.append(el("span", c.message, { class: "caveat" }));
    card.append(caveats);
  }
  const foot = el("div", null, { class: "answer-foot" });
  const evidence = el("button", `Evidence (${(run.citations || []).length})`, { class: "btn", type: "button" });
  evidence.addEventListener("click", () => { select(run); setTab("evidence"); openInspector(); });
  const copy = el("button", "Copy answer", { class: "btn", type: "button" });
  copy.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(run.answer || ""); copy.textContent = "Copied"; }
    catch { copy.textContent = "Copy failed"; }
    setTimeout(() => { copy.textContent = "Copy answer"; }, 1500);
  });
  foot.append(evidence, copy);
  if (run.timing) foot.append(el("span", `${seconds(run.timing.total_ms)} · ${run.timing.model_requests} model calls`, { class: "meta" }));
  card.append(foot);
  card.addEventListener("click", (e) => { if (!e.target.closest("button, mark")) select(run); });
  row.append(card);
  return row;
}

function updateContext() {
  const last = thread.at(-1);
  $("context-hint").textContent = last
    ? (last.status === "clarify" ? "Replying to the clarifying question above" : "Follow-ups continue this conversation")
    : "New conversation";
  $("question").placeholder = last && last.status === "clarify"
    ? "Your reply, e.g. the lead form promo, last October to December"
    : "Ask about campaigns, leads, spend, attribution or data quality…";
}

async function ask() {
  const input = $("question");
  const question = input.value.trim();
  if (!question || $("ask").disabled) return;
  const follows = thread.length ? thread.at(-1).run_id : null;
  const pending = { question, started: Date.now() };
  input.value = ""; autosize();
  $("ask").disabled = true;
  renderThread(pending);
  let run;
  try {
    const r = await fetch("/api/v1/assistant/ask", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, follows }),
    });
    const body = await r.json();
    if (!r.ok) throw new Error(typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail));
    run = body;
    run.question = question;
    run.created_at = new Date().toISOString();
  } catch (error) {
    run = { question, status: "failed", segments: [], citations: [], caveats: [], calls: [],
            errors: [String(error.message || error)], answer: null };
  } finally {
    clearInterval(pending.timer);
    $("ask").disabled = false;
  }
  thread.push(run);
  renderThread();
  select(run);
  loadHistory();
  input.focus();
}

// ---- Inspector -----------------------------------------------------------------------------
function select(run) {
  selectedRun = run;
  activeCitation = null;
  document.querySelectorAll(".answer-card").forEach((c) => c.classList.toggle("selected", c.dataset.run === (run.run_id || "")));
  $("inspector-run").textContent = run.run_id ? `Run ${run.run_id.slice(0, 8)}` : "Not logged";
  // The address points at the selected answer, so it can be bookmarked or shared.
  if (run.run_id) history.replaceState(null, "", `#run=${run.run_id}`);
  renderInspector();
}

function setTab(tab) {
  activeTab = tab;
  document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", String(t.dataset.tab === tab)));
  renderInspector();
}
document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => setTab(t.dataset.tab)));

function showCitation(index) {
  activeCitation = index;
  setTab("evidence");
  openInspector();
  const card = document.querySelector(`.cite[data-index="${index}"]`);
  if (card) card.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

function renderInspector() {
  const body = $("inspector-body");
  body.replaceChildren();
  const run = selectedRun;
  if (!run) { body.append(el("div", "Ask a question or open one from Recent questions. Its evidence, tool calls and timing appear here.", { class: "inspector-empty" })); return; }
  const calls = Object.fromEntries((run.calls || []).filter((c) => c.id).map((c) => [c.id, c]));
  if (activeTab === "evidence") {
    if (!(run.citations || []).length) { body.append(el("div", "This answer contains no numbers.", { class: "inspector-empty" })); return; }
    run.citations.forEach((c, i) => {
      const card = el("div", null, { class: "cite" + (i === activeCitation ? " active" : ""), "data-index": String(i) });
      card.append(el("div", c.shown, { class: "v" }));
      card.append(el("div", `${c.call} · ${calls[c.call] ? calls[c.call].tool : "tool call"}`, { class: "src" }));
      card.append(el("code", c.path));
      body.append(card);
    });
  } else if (activeTab === "calls") {
    if (!(run.calls || []).length) { body.append(el("div", "No tools were called.", { class: "inspector-empty" })); return; }
    for (const c of run.calls) {
      const card = el("div", null, { class: "call" });
      const row = el("div", null, { class: "row1" });
      row.append(statusBadge(c.ok ? "answered" : "failed"));
      row.append(el("strong", c.tool), el("span", null, { class: "spacer" }), el("span", c.id || "not used", { class: "ms" }));
      card.append(row);
      if (c.error) card.append(el("div", c.error, { class: "answer-error" }));
      const details = el("details");
      details.append(el("summary", "Arguments"), el("pre", JSON.stringify(c.arguments, null, 2)));
      card.append(details);
      body.append(card);
    }
  } else {
    const t = run.timing;
    if (!t) { body.append(el("div", "No timing for this answer.", { class: "inspector-empty" })); return; }
    body.append(el("div", seconds(t.total_ms), { class: "timing-total" }));
    body.append(el("div", `${t.model_requests} model requests · ${t.rate_limited} rejected by rate limits`, { class: "src" }));
    const parts = [["Model thinking", t.model_ms, "var(--t1)"], ["Tools (database)", t.tools_ms, "var(--t2)"],
                   ["Waiting on provider limits", t.waiting_ms, "var(--t3)"], ["Other", t.other_ms, "var(--t4)"]];
    const total = parts.reduce((s, p) => s + p[1], 0) || 1;
    const bar = el("div", null, { class: "segbar", role: "img",
      "aria-label": parts.map((p) => `${p[0]} ${seconds(p[1])}`).join(", ") });
    for (const [, ms, color] of parts) {
      if (ms <= 0) continue;
      const seg = el("span"); seg.style.flex = String(ms / total); seg.style.background = color;
      bar.append(seg);
    }
    body.append(bar);
    const table = el("table", null, { class: "legend-table" });
    for (const [name, ms, color] of parts) {
      const tr = el("tr");
      const sw = el("span", null, { class: "swatch" }); sw.style.background = color;
      const td0 = el("td"); td0.append(sw);
      tr.append(td0, el("td", name), el("td", seconds(ms), { class: "num" }), el("td", `${Math.round((ms / total) * 100)}%`, { class: "num" }));
      table.append(tr);
    }
    body.append(table);
    body.append(el("div", "On the free tier, a long answer usually means the model took many steps, which is often a sign of a weaker answer.", { class: "timing-note" }));
  }
}

// ---- Drawers, theme, keyboard --------------------------------------------------------------
function openInspector() {
  if (window.matchMedia("(max-width: 960px)").matches) { $("inspector").classList.add("open"); $("inspector-toggle").setAttribute("aria-expanded", "true"); }
}
function closeDrawers() {
  for (const [panel, button] of [["history", "history-toggle"], ["inspector", "inspector-toggle"]]) {
    $(panel).classList.remove("open"); $(button).setAttribute("aria-expanded", "false");
  }
}
$("history-toggle").addEventListener("click", () => {
  const open = !$("history").classList.contains("open");
  closeDrawers(); $("history").classList.toggle("open", open); $("history-toggle").setAttribute("aria-expanded", String(open));
});
$("inspector-toggle").addEventListener("click", () => {
  const open = !$("inspector").classList.contains("open");
  closeDrawers(); $("inspector").classList.toggle("open", open); $("inspector-toggle").setAttribute("aria-expanded", String(open));
});
$("new-chat").addEventListener("click", () => {
  thread = []; selectedRun = null; renderThread(); renderInspector(); renderHistory();
  history.replaceState(null, "", location.pathname);
  $("inspector-run").textContent = "No answer selected"; $("question").focus();
});

function applyTheme(theme) {
  if (theme) document.documentElement.setAttribute("data-theme", theme);
  else document.documentElement.removeAttribute("data-theme");
}
applyTheme(store.get("miq-theme"));
$("theme").addEventListener("click", () => {
  const dark = document.documentElement.getAttribute("data-theme") === "dark" ||
    (!document.documentElement.getAttribute("data-theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
  const next = dark ? "light" : "dark";
  applyTheme(next); store.set("miq-theme", next);
  if (dashboard) renderTiles();
});

function autosize() {
  const t = $("question");
  t.style.height = "auto";
  t.style.height = `${Math.min(180, t.scrollHeight)}px`;
}
$("question").addEventListener("input", autosize);
$("question").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(); }
});
$("ask").addEventListener("click", ask);
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement.tagName !== "TEXTAREA" && document.activeElement.tagName !== "INPUT") {
    e.preventDefault(); $("question").focus();
  }
  if (e.key === "Escape") closeDrawers();
});

renderThread();
renderInspector();
loadHealth();
loadDashboard();
loadHistory();
const linked = location.hash.match(/^#run=([0-9a-f-]{36})$/);
if (linked) openConversation(linked[1]);
</script>
</body>
