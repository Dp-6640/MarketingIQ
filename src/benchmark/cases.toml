[[case]]
id = "Q04b"
covers = "question-tool-map #4"
scenario = "S11"
question = "Over last heating season (September to February), was the Ottawa furnace campaign more expensive per qualified lead than the Ontario-wide furnace campaign?"
kind = "answer"
calls = [
  { tool = "list_dimension_values", args = { dimension = "campaign", search = "prospecting furnace" } },
  { tool = "get_performance", args = { period = { preset = "custom", start = "2025-09-01", end = "2026-02-28" }, group_by = ["campaign"], filters = { campaigns = ["meta_prospecting_furnace", "meta_prospecting_furnace_ottawa"] }, metrics = ["spend", "qualified_leads", "cost_per_qualified_lead"], attribution_model = "linear" } },
]
warnings = ["mapping_unverified"]
facts = ["1:rows{key=meta_prospecting_furnace_ottawa}.values.cost_per_qualified_lead.value", "1:rows{key=meta_prospecting_furnace}.values.cost_per_qualified_lead.value", "1:resolved.attribution_model"]
expect = [
  { path = "0:match", op = "equals", value = "several" },
  { path = "1:rows{key=meta_prospecting_furnace_ottawa}.values.cost_per_qualified_lead.value", op = "gt", value = "@1:rows{key=meta_prospecting_furnace}.values.cost_per_qualified_lead.value" },
]

