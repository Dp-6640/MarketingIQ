[[case]]
id = "Q13"
covers = "question-tool-map #13"
scenario = "S08"
question = "How much credit does retargeting get under each attribution model over the past year?"
kind = "answer"
calls = [
  { tool = "compare_attribution_models", args = { period = { preset = "last_12_months" }, group_by = "campaign_tactic" } },
]
warnings = ["mapping_unverified", "low_attribution_coverage"]
facts = ["0:rows{key=retargeting}.credit", "0:rows{key=prospecting}.credit", "0:evidence.journey_share"]
expect = [
  { path = "0:rows{key=retargeting}.credit.last_non_direct", op = "gt", value = "@0:rows{key=retargeting}.credit.first_touch" },
  { path = "0:rows{key=prospecting}.credit.first_touch", op = "gt", value = "@0:rows{key=prospecting}.credit.last_non_direct" },
]
forbidden = ["retargeting caused", "retargeting drove"]
notes = "Credit is not effect: the truth files show retargeting has no real effect (S08). The answer must not call the credit an effect."

