# Rules that turn staging rows into the canonical core model.
#
# Every section has a version and a `verified` flag. None of it has been checked against
# LG Home Comfort's real systems yet (docs/unverified-register.md), so every section is
# verified = false, and results that depend on it carry the `mapping_unverified` caveat.
# Values on the left are what a source sends; values on the right are canonical values
# from src/marketingiq/core/vocabulary.py.

[channels]
version = "2026-10-15"
verified = false
search_engines = ["google", "bing", "yahoo", "duckduckgo"]
social_sources = ["facebook", "instagram", "m.facebook.com", "l.facebook.com", "lm.facebook.com", "l.instagram.com"]
paid_search_mediums = ["cpc", "ppc", "paidsearch"]
paid_social_mediums = ["paid_social", "paidsocial", "cpm"]
email_mediums = ["email"]
# GA4 placeholder campaign values that mean "no campaign".
untagged_campaigns = ["(organic)", "(direct)", "(referral)", "(not set)", "(none)"]

[campaign_mapping]
version = "2026-10-15"
# U-17: the marketing team's naming sheet hasn't been reviewed against the ad accounts.
verified = false

[site]
version = "2026-10-15"
# U-16: page map of the synthetic site; the real site's paths are unverified.
verified = false
home = ["/"]
quote = ["/get-a-quote/"]
careers = ["/careers/"]
blog_prefix = "/blog/"
location_prefix = "/locations/"
offer_prefix = "/offers/"

[site.service_pages]
"/heating/furnaces/" = "furnace"
"/cooling/air-conditioners/" = "air_conditioner"
"/heating-cooling/heat-pumps/" = "heat_pump"
"/water/water-heaters/" = "water_heater"
"/water/water-treatment/" = "water_treatment"
"/air-quality/" = "air_quality"
"/home-security/" = "security"
"/generators/" = "generator"
"/maintenance-plan/" = "maintenance_plan"

[geography]
version = "2026-10-15"
# U-18: region grouping and aliases are this project's reporting choice, not yet reviewed.
verified = false

[[geography.regions]]
key = "gta"
cities = ["Toronto", "Mississauga", "Brampton", "Vaughan", "Markham", "Oakville", "Ajax", "Oshawa", "Milton"]

[[geography.regions]]
