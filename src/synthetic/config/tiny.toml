# Small world for fast integration tests. Inherits everything from default.toml except what
# is set here. Every value is a synthetic assumption.

extends = "default"
name = "tiny"
campaign_modifiers = []

[window]
start = 2026-01-01
end = 2026-03-31
data_as_of = 2026-03-31
burn_in_days = 14

[meta_account]
# Deliberately differs from the reporting time zone, to exercise timezone_mismatch handling.
timezone = "America/Los_Angeles"

[traffic]
demand_households_per_day = 4.0
no_need_sessions_per_day = 8.0

[[regions]]
key = "gta"
name = "Greater Toronto Area"
share = 1.0
cities = [
    { name = "Toronto", weight = 0.60, slug = "toronto", aliases = ["T.O."] },
    { name = "Mississauga", weight = 0.40, slug = "mississauga" },
]

