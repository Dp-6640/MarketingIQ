]
notes = "The honest answer: no visible campaign matches. Heat-pump spend rose about 37% but the campaign is credited with no qualified leads in either month, and the rest are hidden as small counts. S04's planted quality drop is invisible in attributed data (docs/benchmark.md)."

[[case]]
id = "Q19"
covers = "question-tool-map #19"
scenario = "S05"
question = "Did the location-page redesign change how often visitors submit a form?"
kind = "answer"
calls = [
  { tool = "list_annotations", args = { annotation_type = "site_change" } },
  { tool = "get_performance", args = { period = { preset = "custom", start = "2026-05-12", end = "2026-06-10" }, compare_to = "custom", comparison = { preset = "custom", start = "2026-04-12", end = "2026-05-11" }, group_by = ["landing_page_type"], metrics = ["sessions", "form_submit_rate"] } },
]
warnings = ["change_within_noise"]
facts = ["0:annotations[0]", "1:rows{key=location}.values.sessions.value", "1:rows{key=location}.values.form_submit_rate"]
expect = [
  { path = "0:annotations[0].start_date", op = "equals", value = "2026-05-12" },
  { path = "1:rows{key=location}.values.form_submit_rate.change_significant", op = "equals", value = false },
]
forbidden = ["caused", "because of the redesign", "thanks to the redesign", "the redesign worked", "the redesign hurt"]
notes = "The honest answer: no detectable change. Location pages get about 420 sessions and 19 form submissions a month, so chance alone moves the rate by about 23%; the planted +20% (S05) can't be told apart from noise. The answer should say what volume or test would settle it."

