[classification]
version = "2026-10-15"
verified = false
# Submissions from the same person within this window are duplicates of the first.
duplicate_window_hours = 72

# U-20: request type when the lead has no structured field.
[classification.entry_point_defaults]
web_quote_form = "install_replace"
booking = "install_replace"

[classification.tactic_defaults]
lead_form = "install_replace"
promo = "install_replace"

[attribution]
version = "2026-10-15"
verified = false
# Sessions this many days before a lead (or less) count as its journey.
lookback_days = 30
# Attribution credits are built for each of these windows; the default must be one of them.
supported_lookback_days = [7, 30, 90]
