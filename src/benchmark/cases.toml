covers = "question-tool-map #3"
question = "How many qualified leads did each service line bring in, by region, last quarter compared with the same quarter last year?"
kind = "answer"
calls = [
  { tool = "get_performance", args = { period = { preset = "last_quarter" }, compare_to = "same_period_last_year", group_by = ["service_line", "region"], metrics = ["qualified_leads"], limit = 100 } },
]
warnings = ["mapping_unverified", "small_cell_suppressed"]
facts = ["0:resolved.comparison", "0:totals.qualified_leads.value", "0:totals.qualified_leads.previous"]
expect = [
  { path = "0:resolved.comparison.start", op = "equals", value = "2025-07-01" },
]

