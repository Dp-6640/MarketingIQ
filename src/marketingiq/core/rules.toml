[geography.location_slugs]
toronto = "Toronto"
mississauga = "Mississauga"
brampton = "Brampton"
vaughan = "Vaughan"
markham = "Markham"
oakville = "Oakville"
ajax = "Ajax"
oshawa = "Oshawa"
